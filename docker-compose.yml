name: auto-parts-store

services:
  frontend:
    image: node:24.15.0-bookworm
    working_dir: /workspace
    environment:
      CI: "true"
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@11.1.3 --activate &&
      pnpm install --frozen-lockfile=false &&
      pnpm --dir frontend dev --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - frontend_node_modules:/workspace/frontend/node_modules
      - pnpm_store:/workspace/.pnpm-store
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: >
      sh -lc "composer install --no-interaction --prefer-dist &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${BACKEND_PORT:-8000}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      SANCTUM_STATEFUL_DOMAINS: "localhost:${FRONTEND_PORT:-5173},127.0.0.1:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-auto_parts_store}"
      DB_USERNAME: "${DB_USERNAME:-auto_parts_user}"
      DB_PASSWORD: "${DB_PASSWORD:-auto_parts_password}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root_password}"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: "${DB_DATABASE:-auto_parts_store}"
      MARIADB_USER: "${DB_USERNAME:-auto_parts_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-auto_parts_password}"
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0

  # ---- Interfaz phpMyAdmin para la base de datos unificada ----
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M                # permite importar dumps grandes desde la interfaz
    ports:
      - "8081:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend_net
    mem_limit: 512m
    cpus: 0.5

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  frontend_node_modules:
  root_node_modules:
  pnpm_store:
  backend_vendor:
  mariadb_data:
